name: build

on:
  push:
  pull_request:

jobs:
  # First, because it costs seconds and needs nothing installed. Same position
  # it holds in SurView DIC's own workflow.
  no-em-dashes:
    name: no non-ASCII dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check-no-em-dashes.sh

  # Two jobs, because the window and the library have different reach.
  #
  # patternfab-core, patternfab-cli and the whole test suite build on any
  # distribution. patternfab-gui additionally needs a VTK whose GUISupportQt
  # is built against Qt6, and ubuntu-latest (24.04, VTK 9.1) builds it against
  # Qt5. Running only the second job would leave the library untested wherever
  # the preview runner is unavailable; running only the first would never
  # compile the window at all. Both, then.

  core:
    name: core, cli and tests (any distribution)
    needs: no-em-dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvtk9-dev \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            libdime-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DPATTERNFAB_BUILD_GUI=OFF

      - name: Build
        run: cmake --build build --parallel

      # From the build root, which is where a person runs it. Pointed at
      # build/core/tests until 2026-09-02 to work around enable_testing()
      # living in core/ rather than at the top level.
      - name: Test
        run: ctest --test-dir build --output-on-failure


  sanitizers:
    name: core and tests under address + UB sanitizers
    needs: no-em-dashes
    runs-on: ubuntu-latest
    # ⚑ THE CLASS NO ASSERTION CAN CATCH. A read one element past the end of a
    # vector returns whatever sits there and changes nothing downstream, so a
    # test cannot see it and a mutation sweep reports it as a survivor with
    # nothing to be done about it. Fourteen of the survivors standing after the
    # sweep of 2026-09-11 are exactly that shape, each with a note beside it
    # saying no case was coming. This is the job that closes them.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvtk9-dev \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            libdime-dev \
            nlohmann-json3-dev

      - name: Configure with sanitizers
        run: cmake -B build-asan -S . -DPATTERNFAB_SANITIZE=ON -DPATTERNFAB_BUILD_GUI=OFF

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test under the sanitizers
        # Leaks are off on purpose: Qt keeps singletons alive to exit by design,
        # and LeakSanitizer buries our own signal in that housekeeping. Memory
        # ERRORS are the class being hunted and those are reported.
        # -fno-sanitize-recover is compiled in, so a diagnostic is a failure
        # rather than a line in a log nobody reads.
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure

  gui:
    name: full build including the window (Ubuntu 26.04)
    needs: no-em-dashes
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvtk9-dev libvtk9-qt-dev \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            libdime-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
